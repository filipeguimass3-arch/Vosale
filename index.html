.hero:after{content:"";position:absolute;inset:auto 0 0;height:7px;background:linear-gradient(90deg,var(--red) 0 33%,var(--gold) 33% 66%,var(--green) 66%)}
.hero-content{position:relative;z-index:1;max-width:720px}
.profile-logo{width:132px;height:132px;object-fit:cover;border-radius:50%;border:4px solid #fff;box-shadow:0 9px 28px #0008;background:#fff}
.hero h1{font-size:clamp(2rem,5vw,3rem);margin:13px 0 5px;letter-spacing:.4px}
.hero p{margin:0;color:#f4ead9;line-height:1.5;font-weight:600;letter-spacing:.04em}
.tabs{position:sticky;top:0;z-index:20;background:rgba(255,250,240,.97);backdrop-filter:blur(12px);box-shadow:0 4px 16px #211b1614;border-bottom:1px solid #e8ddca}
.tabs-inner{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:12px 16px;max-width:1160px;margin:auto}
.tabs-inner::-webkit-scrollbar{display:none}
.tabs a{flex:none;padding:9px 15px;border:1px solid #dfd2bd;border-radius:999px;background:#fff;color:var(--ink);text-decoration:none;font-weight:700;font-size:13px;white-space:nowrap;transition:.2s}
.tabs a.active,.tabs a:active{background:var(--green);color:#fff;border-color:var(--green)}
.wrap{max-width:1160px;margin:0 auto;padding:28px 18px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
.cat{scroll-margin-top:76px;margin-bottom:32px}
.cat h2{font-size:23px;margin:0 0 16px;color:var(--ink);display:inline-block;padding-bottom:7px;border-bottom:3px solid var(--gold)}
.grid{display:grid;grid-template-columns:1fr;gap:13px}
.item{width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:16px;background:#fff;border:1px solid #eadfce;border-radius:16px;box-shadow:0 5px 18px #3b29100b;transition:transform .16s,box-shadow .16s}
.item:hover{transform:translateY(-2px);box-shadow:0 9px 24px #3b291018}
.item .t{flex:1;min-width:0}
.item h3{margin:0;font-size:16px;line-height:1.3;color:var(--ink)}
.item p{margin:6px 0 0;font-size:13px;line-height:1.45;color:var(--muted)}
.item .pr{display:inline-block;margin-top:10px;font-size:17px;font-weight:800;color:var(--green)}
.plus{flex:none;width:42px;height:42px;display:grid;place-items:center;background:var(--green);color:white;border-radius:50%;font-size:24px;font-weight:400}
.panel{position:fixed;left:0;right:0;bottom:0;z-index:40;max-height:92vh;overflow-y:auto;background:var(--cream);border-radius:22px 22px 0 0;padding:20px 17px calc(22px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .3s ease;box-shadow:0 -12px 35px #0003;border-top:3px solid var(--green)}
.panel.open{transform:none}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #e4d8c5}
.ph h2{margin:0;font-size:22px}
.x{width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid #e4d8c5;font-size:17px}
.scrim{position:fixed;inset:0;z-index:30;background:#17130f9c;backdrop-filter:blur(2px);display:none}
.scrim.show{display:block}
.line{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px dashed #d9cbb5}
.line b{font-weight:700}
.line em{display:block;margin-top:4px;font-size:12px;color:var(--muted);font-style:normal}
.line .r{display:flex;align-items:flex-start;gap:8px;flex:none;font-weight:700}
.line .r button{width:28px;height:28px;background:#f5e7df;color:var(--red);border-radius:7px}
.empty{text-align:center;color:var(--muted);padding:24px 0;line-height:1.5}
.tot{display:flex;justify-content:space-between;align-items:center;margin:16px 0;padding:14px;background:#fff;border:1px solid #e7dbc8;border-radius:14px}
.tot span{font-weight:700}.tot b{font-size:24px;color:var(--green)}
.lbl{display:block;margin:0 0 8px;font-weight:700;font-size:13px}
.sec{margin-bottom:20px}.stack>*+*{margin-top:10px}
.in{width:100%;padding:13px 14px;background:#fff;border:1px solid #dfd2bd;border-radius:11px;font-size:14px;outline:none}
.in:focus{border-color:var(--green);box-shadow:0 0 0 3px #147b4218}
.in::placeholder{color:#9a9084}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:44px;background:#fff;border:1px solid #dfd2bd;border-radius:11px;font-weight:700;font-size:13px}
.seg button.on{background:#e4f0e7;border-color:var(--green);color:var(--green)}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:15px 18px;border-radius:12px;background:var(--green);color:#fff;font-weight:800;font-size:15px;transition:.15s}
.btn:active{transform:scale(.99)}
.btn.split{justify-content:space-between}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#211b16;padding:11px 14px calc(11px + env(safe-area-inset-bottom));box-shadow:0 -4px 14px #0002}
.bar button{width:100%;display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:var(--gold);color:#211b16;border-radius:12px;font-weight:800}
.bar .n{display:inline-grid;place-items:center;width:26px;height:26px;margin-right:9px;border-radius:50%;background:var(--green);color:white;font-size:13px}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:#17130fb3;backdrop-filter:blur(3px)}
.modal.show{display:flex}
.sheet{width:100%;max-width:540px;max-height:90vh;overflow-y:auto;background:var(--cream);border-radius:22px 22px 0 0;padding:23px 18px calc(22px + env(safe-area-inset-bottom));animation:up .2s ease}
@keyframes up{from{transform:translateY(25px);opacity:.7}to{transform:none;opacity:1}}
.sheet h3{margin:0;font-size:21px}.sheet .d{margin:8px 0 16px;color:var(--muted);font-size:14px;line-height:1.5}
.qty-container,.addon-row{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #e5d9c7;border-radius:12px;padding:11px 13px;margin:12px 0}
.qty-controls,.addon-qty-controls{display:flex;align-items:center;gap:10px}
.qty-btn,.addon-qty-btn{width:32px;height:32px;border-radius:9px;background:#e4f0e7;color:var(--green);font-weight:800;font-size:18px}
#modal-qty,.addon-qty-val{font-weight:800;min-width:20px;text-align:center}
.addons-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.addon-row{margin:0}.addon-info{display:flex;flex-direction:column;gap:4px;font-size:13px}.addon-info b{font-size:13px}.addon-info span{color:var(--green);font-weight:700}
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,15px);z-index:60;background:#211b16;color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;padding:22px 15px 30px;color:#897d6e;font-size:12px}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}.hero{min-height:360px}.profile-logo{width:145px;height:145px}}
@media(min-width:1000px){
 body{padding-bottom:25px}
 .wrap{grid-template-columns:minmax(0,1fr) 390px;align-items:start}
 .panel{position:sticky;top:82px;transform:none;max-height:calc(100vh - 100px);border:1px solid #e4d8c5;border-radius:18px;box-shadow:0 10px 30px #3b29100c;background:#fff}
 .bar,.scrim.c,.x.c{display:none!important}
 .modal{align-items:center}
 .sheet{border-radius:22px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>
</head>

<nav class="tabs" aria-label="Categorias de produtos"><div class="tabs-inner" id="tabs"></div></nav>

<div class="wrap">
 <main id="menu" aria-label="Catálogo de produtos"></main>
 <aside id="panel" class="panel">
  <div class="ph"><h2>Seu pedido</h2><button class="x c" onclick="toggleCart(false)" aria-label="Fechar carrinho">✕</button></div>
  <div id="cart-list"></div>
  <div class="tot"><span>Total do pedido</span><b id="total">R$ 0,00</b></div>
  <div class="sec stack">
   <span class="lbl">Seus dados para entrega</span>
   <input class="in" id="c-nome" placeholder="Seu nome completo" autocomplete="name">
   <div class="seg">
    <button id="t-del" class="on" onclick="setTipo('Delivery')">🛵 Entrega</button>
    <button id="t-ret" onclick="setTipo('Retirada')">🛍️ Retirada</button>
   </div>
   <div id="end-box" class="stack">
    <input class="in" id="c-rua" placeholder="Rua, número e bairro" autocomplete="street-address">
    <div style="display:flex;gap:9px">
     <input class="in" id="c-num" placeholder="Nº" style="max-width:90px">
     <input class="in" id="c-ref" placeholder="Ponto de referência" style="flex:1">
    </div>
   </div>
  </div>
  <div class="sec">
   <span class="lbl">Forma de pagamento</span>
   <div class="seg" id="pay-seg">
    <button type="button" onclick="setPay('Pix')">💠 Pix</button>
    <button type="button" onclick="setPay('Cartão')">💳 Cartão</button>
    <button type="button" onclick="setPay('Dinheiro')">💵 Dinheiro</button>
   </div>
   <div id="troco-box" class="stack" style="display:none;margin-top:10px">
    <input class="in" id="c-troco" type="text" inputmode="decimal" placeholder="Troco para quanto? (ex.: 50)">
    <label style="display:flex;align-items:center;gap:8px;font-size:13px"><input type="checkbox" id="c-semtroco" onchange="document.getElementById('c-troco').disabled=this.checked"> Não preciso de troco</label>
   </div>
  </div>
  <button class="btn" onclick="enviar()">Enviar pedido pelo WhatsApp</button>
 </aside>
</div>

<div id="scrim" class="scrim c" onclick="toggleCart(false)"></div>
<div class="bar"><button onclick="toggleCart(true)"><span><span class="n" id="bar-n">0</span>Ver meu carrinho</span><span id="bar-total">R$ 0,00</span></button></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeItem()"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast" role="status"></div>
<footer>© <span id="year"></span> Vosale Temperos. Todos os direitos reservados.</footer>

<script>
let cart = [];
let modo = "Delivery";
let pay = "";
let cur = null;
let modalQty = 1;
let modalAddons = {};

const dados = {
 "🌶️ Pimentas & Molhos": [
  {n:"Molho de Pimenta Gourmet (200ml)",p:18.00,d:"Receita artesanal picante com pimentas selecionadas, azeite e especiarias secretas."},
  {n:"Pimenta de Cheiro no Azeite (150g)",p:22.00,d:"Conserva artesanal de pimenta de cheiro aromática em azeite de oliva extra virgem."},
  {n:"Geleia de Pimenta Defumada (230g)",p:25.00,d:"Combinação agridoce perfeita de pimenta dedo-de-moça defumada. Ideal para queijos e carnes."}
 ],
 "🧄 Temperos & Pastas": [
  {n:"Pasta de Alho com Ervas Frescas (300g)",p:15.00,d:"Zero conservantes químicos. Alho puro batido com ervas selecionadas para praticidade diária."},
  {n:"Sal Temperado Churrasco (500g)",p:19.00,d:"Mistura especial de sal grosso moído, alho defumado, pimenta e ervas finas."},
  {n:"Tempero Baiano da Casa (100g)",p:12.00,d:"Blend tradicional de cominho, coentro, pimenta-do-reino e açafrão moídos na hora."}
 ],
 "🌿 Ervas & Especiarias": [
  {n:"Kit Ervas Finas (Manjerona, Tomilho, Alecrim)",p:16.00,d:"Trio de ervas desidratadas de alta qualidade para finalizar molhos, massas e assados."},
  {n:"Chimichurri Especial Sem Pimenta (100g)",p:14.00,d:"Blend tradicional argentino com salsa, alho, orégano e vinagre em pó. Excelente para grelhados."},
  {n:"Lemon Pepper Premium (100g)",p:15.00,d:"Especiaria marcante com toque cítrico de limão siciliano e pimenta moída para aves e peixes."}
 ],
 "🎁 Kits & Presentes": [
  {n:"Kit Mestre do Churrasco",p:45.00,d:"Inclui: 1 Sal temperado churrasco + 1 Molho de Pimenta Gourmet + 1 Chimichurri Especial."},
  {n:"Kit Sabores do Brasil",p:52.00,d:"Inclui: 3 temperos secos da casa + 1 Pasta de Alho com Ervas de 300g."}
 ]
};

const LISTA_ADICIONAIS = [
 {n:"Embalagem para Presente",p:5.00},
 {n:"Extra Pimenta Calabresa",p:3.00},
 {n:"Pote de Vidro Hermético Extra",p:8.00},
 {n:"Colher de Madeira Artesanal",p:6.00}
];

const ITEMS = [];
const brl = v => "R$ " + Number(v).toFixed(2).replace(".",",");
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function render(){
 const menu=document.getElementById("menu"),tabs=document.getElementById("tabs");
 let out="",ci=0;
 tabs.innerHTML="";
 for(const cat in dados){
  tabs.insertAdjacentHTML("beforeend",`<a href="#cat-${ci}" id="tab-link-${ci}" onclick="setActiveTab(${ci})">${esc(cat)}</a>`);
  out+=`<section class="cat" id="cat-${ci}"><h2>${esc(cat)}</h2><div class="grid">`;
  dados[cat].forEach(i=>{
   const id=ITEMS.push({...i})-1;
   out+=`<button class="item" type="button" onclick="openItem(${id})">
    <span class="t"><h3>${esc(i.n)}</h3><p>${esc(i.d)}</p><span class="pr">${brl(i.p)}</span></span>
    <span class="plus" aria-hidden="true">+</span>
   </button>`;
  });
  out+="</div></section>";ci++;
 }
 menu.innerHTML=out;
}

function setActiveTab(idx){
 document.querySelectorAll(".tabs a").forEach((a,i)=>a.classList.toggle("active",i===idx));
}
function openItem(id){
 cur=id;modalQty=1;modalAddons={};
 const it=ITEMS[id];
 let adds=LISTA_ADICIONAIS.map((a,i)=>`
  <div class="addon-row">
   <div class="addon-info"><b>${esc(a.n)}</b><span>+ ${brl(a.p)}</span></div>
   <div class="addon-qty-controls">
    <button type="button" class="addon-qty-btn" onclick="alterarAddonQtd(${i},-1)">−</button>
    <span id="addon-qty-${i}" class="addon-qty-val">0</span>
    <button type="button" class="addon-qty-btn" onclick="alterarAddonQtd(${i},1)">+</button>
   </div>
  </div>`).join("");
 document.getElementById("sheet").innerHTML=`
  <h3>${esc(it.n)}</h3><p class="d">${esc(it.d)}</p>
  <div class="qty-container"><b>Quantidade:</b><div class="qty-controls">
   <button type="button" class="qty-btn" onclick="alterarQtd(-1)">−</button><span id="modal-qty">1</span>
   <button type="button" class="qty-btn" onclick="alterarQtd(1)">+</button>
  </div></div>
  <label class="lbl" for="obs">Observações / Preferências:</label>
  <textarea id="obs" class="in" rows="2" maxlength="160" placeholder="Ex.: embalagem separada, alguma observação..."></textarea>
  <label class="lbl" style="margin-top:17px">Deseja embalagem ou adicionais?</label>
  <div class="addons-list">${adds}</div>
  <div style="margin-top:20px"><button class="btn split" onclick="confirmItem()"><span>Adicionar ao carrinho</span><span id="modal-total">${brl(it.p)}</span></button></div>`;
 document.getElementById("modal").classList.add("show");
}
function alterarQtd(change){
 modalQty=Math.max(1,modalQty+change);
 document.getElementById("modal-qty").textContent=modalQty;
 calcModalTotal();
}
function alterarAddonQtd(idx,change){
 modalAddons[idx]=Math.max(0,(modalAddons[idx]||0)+change);
 document.getElementById(`addon-qty-${idx}`).textContent=modalAddons[idx];
 calcModalTotal();
}
function calcModalTotal(){
 const base=ITEMS[cur].p;
 const extras=LISTA_ADICIONAIS.reduce((sum,a,i)=>sum+(modalAddons[i]||0)*a.p,0);
 document.getElementById("modal-total").textContent=brl((base+extras)*modalQty);
}
function closeItem(){document.getElementById("modal").classList.remove("show");cur=null}
function confirmItem(){
 if(cur===null)return;
 const it=ITEMS[cur];
 const selected=LISTA_ADICIONAIS.map((a,i)=>({n:a.n,q:modalAddons[i]||0,p:a.p})).filter(a=>a.q>0);
 const extras=selected.reduce((s,a)=>s+a.q*a.p,0);
 cart.push({n:it.n,p:(it.p+extras)*modalQty,qtd:modalQty,obs:document.getElementById("obs").value.trim(),addons:selected});
 closeItem();update();toast("Produto adicionado ao pedido");
}
function remove(i){cart.splice(i,1);update()}
function update(){
 const list=document.getElementById("cart-list");
 const total=cart.reduce((s,i)=>s+i.p,0);
 if(!cart.length)list.innerHTML='<p class="empty">Seu carrinho está vazio.<br>Escolha os produtos no catálogo.</p>';
 else list.innerHTML=cart.map((it,i)=>{
  const extras=it.addons.length?`<em>Adicionais: ${it.addons.map(a=>`${a.q}x ${esc(a.n)}`).join(", ")}</em>`:"";
  const obs=it.obs?`<em>Obs.: ${esc(it.obs)}</em>`:"";
  return `<div class="line"><div><b>${it.qtd}x ${esc(it.n)}</b>${extras}${obs}</div><div class="r"><span>${brl(it.p)}</span><button type="button" onclick="remove(${i})" aria-label="Remover item">✕</button></div></div>`;
 }).join("");
 document.getElementById("total").textContent=brl(total);
 document.getElementById("bar-total").textContent=brl(total);
 document.getElementById("bar-n").textContent=cart.reduce((s,i)=>s+i.qtd,0);
}
function setTipo(t){
 modo=t;const delivery=t==="Delivery";
 document.getElementById("t-del").classList.toggle("on",delivery);
 document.getElementById("t-ret").classList.toggle("on",!delivery);
 document.getElementById("end-box").style.display=delivery?"block":"none";
}
function setPay(p){
 pay=p;
 document.querySelectorAll("#pay-seg button").forEach(b=>b.classList.toggle("on",b.textContent.includes(p)));
 document.getElementById("troco-box").style.display=p==="Dinheiro"?"block":"none";
}
function toggleCart(open){
 document.getElementById("panel").classList.toggle("open",open);
 document.getElementById("scrim").classList.toggle("show",open);
}
function toast(message){
 const el=document.getElementById("toast");el.textContent=message;el.classList.add("show");
 clearTimeout(el._timer);el._timer=setTimeout(()=>el.classList.remove("show"),1800);
}
function enviar(){
 const nome=document.getElementById("c-nome").value.trim();
 if(!nome)return alert("Por favor, informe seu nome.");
 if(!cart.length)return alert("Seu carrinho está vazio.");
 if(!pay)return alert("Escolha a forma de pagamento.");
 let total=0;
 let msg=`🌶️ *NOVO PEDIDO — VOSALE TEMPEROS*\\n\\n👤 *Cliente:* ${nome}\\n📦 *Tipo:* ${modo}\\n\\n🛒 *ITENS DO PEDIDO:*\\n`;
 cart.forEach(i=>{
  msg+=`• ${i.qtd}x ${i.n} — ${brl(i.p)}\\n`;
  if(i.addons.length)msg+=`  Adicionais: ${i.addons.map(a=>`${a.q}x ${a.n}`).join(", ")}\\n`;
  if(i.obs)msg+=`  Observação: ${i.obs}\\n`;
  total+=i.p;
 });
 if(modo==="Delivery"){
  const rua=document.getElementById("c-rua").value.trim();
  const num=document.getElementById("c-num").value.trim();
  const ref=document.getElementById("c-ref").value.trim();
  if(!rua)return alert("Informe o endereço para entrega.");
  msg+=`\\n📍 *ENDEREÇO:*\\n${rua}${num?", Nº "+num:""}${ref?"\\nReferência: "+ref:""}`;
 }else msg+="\\n🛍️ *RETIRADA:* Cliente irá retirar no local.";
 msg+=`\\n\\n💳 *PAGAMENTO:* ${pay}`;
 if(pay==="Dinheiro"){
  const sem=document.getElementById("c-semtroco").checked;
  const troco=document.getElementById("c-troco").value.trim();
  msg+=sem?" (não precisa de troco)":troco?` (troco para R$ ${troco})`:" (troco não informado)";
 }
 msg+=`\\n\\n💰 *TOTAL: ${brl(total)}*`;
 const numeroWhatsapp="5538998122614";
 window.open(`https://wa.me/${numeroWhatsapp}?text=${encodeURIComponent(msg)}`,"_blank","noopener");
}
document.getElementById("year").textContent=new Date().getFullYear();
render();update();
</script>
</body>
</html>
